name: Demo pages

# The public replay demo: the dashboard built to answer every API request from the recording in
# apps/web/public/demo-data, served by GitHub Pages. Only the demo branch,
# which carries the recording, deploys.
on:
  push:
    branches: [demo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: demo-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Recording present
        run: test -f public/demo-data/manifest.json
      - run: npm test
      - name: Build the replay demo
        env:
          VITE_DEMO_STATIC: "1"
          DEMO_BASE: /${{ github.event.repository.name }}/
        run: npm run build
      # Paths the app does not know still open it (navigation inside it is by #).
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
